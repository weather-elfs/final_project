services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      KMA_AUTH_KEY: ${KMA_AUTH_KEY:-}
      KMA_API_KEY: ${KMA_API_KEY:-}
      AIRKOREA_API_KEY: ${AIRKOREA_API_KEY:-}
      DATA_API_KEY: ${DATA_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
